  if (full.length === 1) return { kind: "unique", p: full[0] };
  if (full.length > 1) return { kind: "multiple" };
  if (partial.length > 0) return { kind: "partial" };
  return { kind: "none" };
}
async function lookup() {
  const rawName = document.getElementById("name").value.trim();
  const rawEmail = document.getElementById("email").value.trim();
  if (!rawName || !rawEmail) { show("err", "يُرجى ملء الحقلين معاً — الاسم الكامل والبريد الإلكتروني — لنتحقّق من هويتك بدقة."); return; }
  let emailRec = null;
  if (window.crypto && crypto.subtle) {
    const h = await sha256(rawEmail.replace(/\s/g, "").toLowerCase());
    emailRec = DATA.find(x => x.eh === h) || null;
  }
  const nm = nameMatch(rawName);
  const pick = emailRec || (nm.kind === "unique" ? nm.p : null);
  if (pick) {
    if (!pick.e) {
      let msg = `<div class="greet">أهلاً بك <b>${pick.n}</b></div>`;
      msg += pick.s === 1
        ? `سجّلنا لك تسليم <b>واجب واحد</b> من أصل ثلاثة، في حين يُشترط لاستحقاق الشهادة تسليم واجبين فأكثر — نشكر مشاركتك ونتمنى لقاءك في دوراتنا القادمة.`
        : `أنت مسجَّل في الدورة غير أنّه لم يصلنا منك أيُّ واجب، لذا لا تنطبق عليك شروط استحقاق الشهادة — نتمنى لقاءك في دوراتنا القادمة.`;
      show("no", msg);
      return;
    }
    let extra = "";
    if (emailRec && !(nm.kind === "unique" && nm.p === emailRec)) {
      extra = `<div class="notice">⚠ البريد الإلكتروني مطابقٌ لسجل التسجيل، غير أنّ الاسم المُدخل يختلف عن المسجَّل لدينا — الشهادة صادرة بالبيانات الرسمية الموضّحة أعلاه.</div>`;
    } else if (!emailRec && nm.kind === "unique") {
      extra = `<div class="notice">⚠ الاسم مطابقٌ لسجل التسجيل، غير أنّ البريد الإلكتروني المُدخل يختلف عن المسجَّل لدينا${pick.em ? ` (<span class="mail">${pick.em}</span>)` : ""} — يُرجى مراسلة إدارة الدورة لتحديثه إن لم يعد متاحاً لديك.</div>`;
    }
    show("ok", eligibleCard(pick, extra));
    return;
  }
  if (nm.kind === "multiple") show("warn", "يوجد أكثر من مشترك بهذا الاسم، والبريد الإلكتروني المُدخل غير مسجَّل لدينا — يُرجى التدقيق في كتابة بريد التسجيل فهو الفيصل في تحديد الهوية.");
  else if (nm.kind === "partial") show("warn", "الاسم قريبٌ من أحد المشتركين لكنه غير مطابق تماماً، والبريد غير مسجَّل — يُرجى كتابة الاسم كما ورد في استمارة التسجيل حرفياً، والتدقيق في البريد الإلكتروني.");
  else if (nm.kind === "short") show("warn", "يُرجى كتابة الاسم <b>الكامل</b> (اسمين على الأقل) مع بريد التسجيل.");
  else show("err", "لم يُعثَر على الاسم ولا على البريد الإلكتروني في قائمة التسجيل — يُرجى التأكد من إدخال البيانات نفسها التي سُجِّلت بها في الاستمارة، فإن تعذّر الأمر يُرجى مراسلة إدارة الدورة.");
}
document.getElementById("name").addEventListener("keydown", e => { if (e.key === "Enter") lookup(); });
document.getElementById("email").addEventListener("keydown", e => { if (e.key === "Enter") lookup(); });
</script>

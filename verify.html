  return null;
}
function show(cls, html) {
  const el = document.getElementById("result");
  el.className = cls; el.innerHTML = html; el.style.display = "block";
}
function go() {
  const raw = document.getElementById("q").value.trim();
  const code = parseCode(raw);
  if (!code) { show("err", "يُرجى إدخال رمز الشهادة بصيغته الصحيحة، مثال: <span style='direction:ltr;display:inline-block'>ICT-VC-2608800</span>"); return; }
  const rec = V[code];
  if (!rec) {
    show("err", `<div class="vseal">⚠️</div><div class="vtitle" style="color:#7a1f1f">لا توجد شهادة بهذا الرمز</div>
      لم يُعثَر على أي شهادة معتمدة تحمل الرمز <b style="direction:ltr;display:inline-block">${code}</b>.<br>
      يُرجى التأكد من كتابة الرمز كما هو مطبوع على الشهادة تماماً؛ فإن تكرّر ظهور هذه الرسالة فالشهادة <b>غير صادرة</b> عن إدارة الدورة.`);
    return;
  }
  const [laqab, nameAr, tok] = rec;
  show("ok", `
    <div class="vseal">🛡️</div>
    <div class="vtitle">شهادة صالحة ومعتمدة ✓</div>
    <div class="greet">تحيةً طيبة، نتشرَّف بتهنئة<br><span class="gname">${laqab ? laqab + " " : ""}${nameAr}</span><br>لإتمام متطلبات الدورة بنجاح</div>
    <span class="codechip">${code}</span>
    <div class="imgwrap" oncontextmenu="return false"><img src="certs/${tok}.jpg" alt="الشهادة" draggable="false"><div class="shield" oncontextmenu="return false"></div></div>
    <div class="accred">هذه الشهادة مُعتمَدة ومُحقَّقة من قِبل<br>الفريق الوطني للذكاء الاصطناعي العراقي 🇮🇶</div>`);
}
document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
document.addEventListener("contextmenu", e => { if (e.target.tagName === "IMG") e.preventDefault(); });
(function () {
  const c = new URLSearchParams(location.search).get("c");
  if (c) { const code = parseCode(c); document.getElementById("q").value = code || c; if (code) go(); }
})();
</script>
</body>
</html>
